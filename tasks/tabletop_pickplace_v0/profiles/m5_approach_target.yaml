# P1：朝预抓点有界步进 + 撤退（Oracle GT / scene.yaml）
# 成功：位置误差 ≤ success_eps_pos_m（略宽于 Scene 名义 ε，便于首通）
profile: m5_approach_target
situation: oracle
forward_wm: off
cup_grid_id: 4
goals:
  - name: APPROACH
    mode: toward
    target_ref: pregrasp_red_cup
    rate_hz: 10.0
    max_duration_s: 12.0
    max_step_m: 0.03
    success_eps_pos_m: 0.04
    expire_ms: 200
    gripper: 0.0
  - name: RETREAT
    mode: toward
    target_ref: retreat
    rate_hz: 10.0
    max_duration_s: 10.0
    max_step_m: 0.03
    success_eps_pos_m: 0.05
    expire_ms: 200
    gripper: 0.0
